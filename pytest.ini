[pytest]
# Run from the project root:  .venv/Scripts/python.exe -m pytest -q
# OWNED BY A1. Markers are explained in SPEC.md section 8.
testpaths = tests
pythonpath = .
qt_api = pyqt6
# several agents run pytest in this folder at the same time: no shared cache files
addopts = -p no:cacheprovider
faulthandler_timeout = 180
markers =
    realinput: injects real keyboard/mouse input into a real window (skipped unless AUTOPRESS_REALINPUT=1; serialized by a lock)
    slow: takes more than about 2 s (OCR engine load, packaging); deselect with -m "not slow"
